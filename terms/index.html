<!doctype html>
<html lang="en" class="no-js">
<head>
  <!--@include(partials/head.html)-->
  <title>Terms of service · Trulinq</title>
  <meta name="description" content="The Trulinq terms of service: accounts, verification, honest use, revocation, fees, content, liability and changes, in plain language.">
  <script type="module" src="/src/js/pages/terms.js"></script>
</head>
<body>
  <!--@include(partials/nav.html)-->
  <main id="main" class="page">
    <section class="panel panel--ice lhero" aria-labelledby="legal-title">
      <div class="lhero__inner">
        <h1 id="legal-title" class="display">Terms of service</h1>
        <p class="lhero__meta">Last updated September 2026 · Applies to the Trulinq website and apps</p>
        <p class="lhero__summary" data-summary></p>
      </div>
    </section>
    <section class="panel panel--paper legal" aria-label="Terms of service">
      <div class="legal__inner">
        <nav class="legal__index" aria-labelledby="legal-index-title">
          <h2 id="legal-index-title" class="legal__index-title">On this page</h2>
          <ul data-index></ul>
        </nav>
        <div class="legal__clauses" data-clauses></div>
      </div>
    </section>
    <section class="panel panel--mist lfoot" aria-labelledby="lfoot-title">
      <div class="lfoot__inner">
        <h2 id="lfoot-title" class="display">Plain language, on purpose.</h2>
        <p>Questions about this? Email <a class="link" data-email href="mailto:{{email.support}}">{{email.support}}</a>. A person reads every message.</p>
        <div class="btn-row">
          <a class="btn btn--ink btn--sm" href="/privacy/"><span>Privacy policy</span></a>
          <a class="btn btn--ghost btn--sm" href="/trust/"><span>Trust Centre</span></a>
          <a class="btn btn--ghost btn--sm" href="/contact/"><span>Contact</span></a>
        </div>
      </div>
    </section>
  </main>
  <!--@include(partials/footer.html)-->
</body>
</html>
