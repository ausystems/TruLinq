<!doctype html>
<html lang="en" class="no-js">
<head>
  <!--@include(partials/head.html)-->

  <meta name="description" content="The Trulinq terms of service: accounts, verification, honest use, revocation, fees, content, liability and changes, in plain language.">
  <script type="module" src="/src/js/pages/terms.js"></script>
</head>
<body>
  <!--@include(partials/nav.html)-->
  <main id="main" class="page">
    <section class="panel panel--cream lhero">
      <div class="lhero__inner">
        <p class="eyebrow" data-reveal="fade">Legal</p>
        <h1 class="display" data-split>Terms of service</h1>
        <p class="lhero__meta mono" data-reveal>Last updated: 2026 · Applies to trulinqid.com and the Trulinq apps</p>

        <nav class="legal__index" aria-label="Sections" data-index></nav>

    <section class="panel panel--cream lfoot">
