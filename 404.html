<!doctype html>
<html lang="en" class="no-js">
<head>
  <!--@include(partials/head.html)-->
  <title>This page isn’t real — Trulinq</title>
  <meta name="robots" content="noindex">
  <script type="module" src="/src/js/pages/notfound.js"></script>
</head>
<body>
  <!--@include(partials/nav.html)-->
  <main id="main" class="page">
    <section class="panel panel--peach nf">
      <div class="nf__inner">
        <div class="nf__stage" aria-hidden="true">
          <div class="nf__code">
            <span class="nf__digit display" data-digit>4</span>
            <span class="nf__digit display" data-digit>0</span>
            <span class="nf__digit display" data-digit>4</span>
          </div>
          <div class="nf__stamp" data-nf-stamp><span class="nf__stamp-inner">Not verified</span></div>
        </div>
        <div class="nf__copy">
          <h1 class="display" data-split>This page isn’t real.</h1>
          <p class="lead" data-reveal>Which is sort of the point of Trulinq. The page you asked for doesn’t exist, was removed, or never passed verification.</p>
          <ul class="ledger nf__ledger" data-nf-ledger>
            <li class="ledger__row"><span>Path</span><i></i><b data-nf-path>/</b></li>
            <li class="ledger__row"><span>Status</span><i></i><b>Not found</b></li>
            <li class="ledger__row"><span>Checked</span><i></i><b data-nf-time>just now</b></li>
            <li class="ledger__row"><span>Verified by</span><i></i><b>No one</b></li>
          </ul>
          <form class="nf__search" data-nf-search data-reveal data-delay=".05">
            <label class="sr-only" for="nf-q">Search the directory</label>
            <input class="input" id="nf-q" type="search" placeholder="Search verified members…" autocomplete="off">
            <button type="submit" class="btn btn--ink"><span>Search</span></button>
          </form>
          <div class="nf__links" data-reveal data-delay=".1">
            <a class="pill" href="/directory/">Directory</a>
            <a class="pill" href="/verify/">Get verified</a>
            <a class="pill" href="/contact/">Contact</a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <!--@include(partials/footer.html)-->
</body>
</html>
