<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <style>html{background:#ecf0f6}html.dark{background:#05080f}</style>
  <title>Join Trulinq</title>
  <script>
    /* the page is gone in a moment; until then it wears the reader's theme, so a dark screen never flashes white */
    (function () { var t = null; try { t = localStorage.getItem('tq-theme'); } catch (e) {} if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.className = 'dark'; })();
    /* /join?ref=CODE is the shareable referral link. It carries the code into the sign-up form; the referral itself is
       recorded once, on the server, when the account is created. */
    (function () {
      var ref = new URLSearchParams(location.search).get('ref') || '';
      var base = location.pathname.replace(/join\/?(index\.html)?$/, '');
      var to = base + 'auth/?mode=signup' + (ref ? '&ref=' + encodeURIComponent(ref) : '');
      location.replace(to);
    })();
  </script>

  <meta property="og:site_name" content="Trulinq">
