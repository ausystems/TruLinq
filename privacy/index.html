<!doctype html>
<html lang="en" class="no-js">
<head>
  <!--@include(partials/head.html)-->
  <title>Privacy policy — Trulinq</title>
  <meta name="description" content="How Trulinq collects, uses, stores and deletes your data. Documents stay private, nothing is sold, and deletion is one email away.">
  <script type="module" src="/src/js/pages/privacy.js"></script>
</head>
<body>
  <!--@include(partials/nav.html)-->
  <main id="main" class="page">
    <section class="panel panel--cream lhero" aria-labelledby="legal-title">
      <div class="lhero__inner">
        <p class="eyebrow">Legal</p>
        <h1 id="legal-title" class="display">Privacy policy</h1>
        <p class="lhero__meta">Last updated September 2026 · Applies to the Trulinq website and apps</p>
        <p class="lhero__summary" data-summary></p>
      </div>
    </section>
    <section class="panel panel--white legal" aria-label="Privacy policy">
      <div class="legal__inner">
        <nav class="legal__index" aria-labelledby="legal-index-title">
          <h2 id="legal-index-title" class="legal__index-title">On this page</h2>
          <ul data-index></ul>
        </nav>
        <div class="legal__clauses" data-clauses></div>
      </div>
    </section>
    <section class="panel panel--cream lfoot" aria-labelledby="lfoot-title">
      <div class="lfoot__inner">
        <h2 id="lfoot-title" class="display">Plain language, on purpose.</h2>
        <p>Questions about this? Email <a class="link" data-email href="mailto:{{email.privacy}}">{{email.privacy}}</a>. A person reads every message.</p>
        <div class="btn-row">
          <a class="btn btn--ink btn--sm" href="/terms/"><span>Terms of service</span></a>
          <a class="btn btn--ghost btn--sm" href="/trust/"><span>Trust Centre</span></a>
          <a class="btn btn--ghost btn--sm" href="/contact/"><span>Contact</span></a>
        </div>
      </div>
    </section>
  </main>
  <!--@include(partials/footer.html)-->
</body>
</html>
