<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECF0F6">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300..700&family=Caveat:wght@500..700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  /* Decided here, before the first paint, so nothing flashes. html.anim: motion is welcome (not with reduced motion,
     not in ?nomotion reviews), so entrances such as the hero title may start hidden. html.has-intro: the intro plays,
     which it does when someone arrives from outside the site or reloads, never when moving between its pages. */
  (function () {
    try {
      var d = document.documentElement, q = location.search;
      if (/[?&]nomotion(=|&|$)/.test(q) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      d.classList.add('anim');
      if (/[?&]nointro(=|&|$)/.test(q)) return;
      var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
      var type = nav ? nav.type : 'navigate';
      if (type === 'back_forward') return;
      var from = null;
      try { from = document.referrer ? new URL(document.referrer) : null; } catch (e) {}
      var inside = from && from.origin === location.origin && !/\/join\/?$/.test(from.pathname);
      if (inside && type !== 'reload') return;
      d.classList.add('has-intro');
      window.__introT0 = performance.now();
    } catch (e) {}
  })();
</script>
<style>
  /* The intro's first frames are drawn by CSS alone, so the logo starts assembling at the first paint. */
  .intro { display: none; }
  html.has-intro .intro { display: block; position: fixed; inset: 0; z-index: 1000; animation: intro-failsafe .01s 4.5s forwards; }
  html.has-intro .nav__logo .wordmark { visibility: hidden; animation: intro-failsafe-show .01s 4.5s forwards; }
  .intro__cover { position: absolute; inset: 0; background: #071A45; clip-path: inset(0% 0% 0% 0% round 0px 0px 0px 0px); }
  .intro__logo { --iw: clamp(260px, 48vw, 600px); position: fixed; left: calc(50% - var(--iw) * .3906); top: calc(50% - var(--iw) * .1136); display: block; width: var(--iw); height: calc(var(--iw) * .2273); overflow: visible; }
  .intro__logo--light { animation: intro-breathe 1s cubic-bezier(.16, 1, .3, 1) both; }
  .intro__bar { animation: intro-bar .46s cubic-bezier(.16, 1, .3, 1) .05s both; }
  .intro__stem { animation: intro-stem .46s cubic-bezier(.16, 1, .3, 1) .17s both; }
  .intro__d { animation: intro-d .56s cubic-bezier(.16, 1, .3, 1) .29s both; }
  .intro__ch { animation: intro-ch .45s cubic-bezier(.16, 1, .3, 1) calc(.38s + var(--i) * .028s) both; }
  @keyframes intro-bar { from { transform: translateX(-750px); } }
  @keyframes intro-stem { from { transform: translateY(-660px); } }
  @keyframes intro-d { from { transform: translateX(-660px); } }
  @keyframes intro-ch { from { transform: translateY(34px); } }
  @keyframes intro-breathe { from { transform: scale(.94); } }
  @keyframes intro-failsafe { to { visibility: hidden; } }
  @keyframes intro-failsafe-show { to { visibility: visible; } }
</style>
