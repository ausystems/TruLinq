<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ECF0F6">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300..700&family=Caveat:wght@500..700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  /* Light or dark: the reader's own choice from the switch in the header, else their system's. Set here, before
     anything paints, so the page never flashes the other theme; src/js/main.js runs the switch. */
  (function () {
    var d = document.documentElement, t = null;
    try { t = localStorage.getItem('tq-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    d.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'dark' ? '#05080F' : '#ECF0F6');
  })();
  /* Decided here, before the first paint, so nothing flashes. html.anim: motion is welcome (not with reduced motion,
     not in ?nomotion reviews), so entrances such as the hero title may start hidden. html.has-intro: the loader plays,
     which it does once per browser tab, on whichever page is opened first, as it does on trulinqid.com. */
  (function () {
    try {
      var d = document.documentElement, q = location.search;
      if (/[?&]nomotion(=|&|$)/.test(q) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      d.classList.add('anim');
      if (/[?&]nointro(=|&|$)/.test(q)) return;
      try { if (sessionStorage.getItem('tq-intro')) return; sessionStorage.setItem('tq-intro', '1'); } catch (e) {}
      d.classList.add('has-intro');
    } catch (e) {}
  })();
</script>
<style>
  /* The loader, timed entirely here from its first frame: the mark fades and grows in over 1s, "Welcome to" rises at
     0.6s, "Trulinq." at 0.9s, the glow breathes, and at 2.4s the panel fades out over 0.7s. */
  html[data-theme="dark"] { background: #05080F; color-scheme: dark; }
  .intro { display: none; }
  html.has-intro .intro { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #060D19; background: oklch(16% .028 260); animation: intro-leave .7s cubic-bezier(.4, 0, .2, 1) 2.4s forwards; }
  .intro__glow { position: absolute; width: 24rem; height: 24rem; border-radius: 50%; background: rgba(41, 129, 251, .25); filter: blur(64px); pointer-events: none; animation: intro-pulse 2s cubic-bezier(.4, 0, .6, 1) infinite; }
  .intro__mark, .intro__welcome, .intro__name { position: relative; display: block; flex: none; overflow: visible; }
  .intro__mark { width: 7rem; height: 7rem; animation: intro-in 1s ease backwards; --in-scale: .75; }
  .intro__welcome { width: 130.113px; height: 16px; margin-top: 2rem; fill: #ABB9C9; fill: oklch(78% .028 252); animation: intro-in .7s ease .6s both; --in-y: .5rem; }
  .intro__name { height: 36px; aspect-ratio: 153.621 / 48; margin: calc(.5rem + 2px) 0 2px; fill: #F4F7FB; fill: oklch(97.5% .006 250); animation: intro-in .7s ease .9s both; --in-y: .75rem; }
  .intro__name .intro__dot { fill: #2981FB; }
  @media (min-width: 40rem) { .intro__mark { width: 9rem; height: 9rem; } .intro__name { height: 48px; margin: .5rem 0 0; } }
  @keyframes intro-in { from { opacity: 0; transform: translate3d(0, var(--in-y, 0), 0) scale3d(var(--in-scale, 1), var(--in-scale, 1), 1); } }
  @keyframes intro-pulse { 50% { opacity: .5; } }
  @keyframes intro-leave { to { opacity: 0; visibility: hidden; } }
</style>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="alternate" type="application/rss+xml" title="Trulinq guides" href="{{site.url}}/blog/feed.xml">
<!-- The canonical address; the Open Graph and X cards, the robots defaults and the structured data are added from
     each page's title and description by src/build/seo.js. -->
<link rel="canonical" href="{{page.url}}">
